name: Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend API & Tests (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore AiDailyExpense.slnx

      - name: Build Solution
        run: dotnet build AiDailyExpense.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test AiDailyExpense.slnx --configuration Release --no-build --verbosity normal

  mobile:
    name: Mobile App (React Native / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/AiDailyExpense.Mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/AiDailyExpense.Mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript (tsc --noEmit)
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

  security:
    name: Security & Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

